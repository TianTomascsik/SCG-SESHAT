[package]
name = "seshat"
version = "0.1.0"
edition = "2021"
description = "SESHAT — SCG benchmark harness (new generation, work in progress)"
license = "Apache-2.0"

# Detach from any parent workspace so this can be split into its own repo cleanly.
[workspace]

[[bin]]
name = "seshat"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = 0
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
