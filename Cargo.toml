[package]
name = "seshat"
version = "0.1.0"
edition = "2021"
description = "SESHAT — SCG benchmark harness (new generation, work in progress)"
license = "Apache-2.0"

# Detach from any parent workspace so this can be split into its own repo cleanly.
[workspace]

[[bin]]
name = "seshat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
libc = "0.2"

# Terminal table rendering (scientific output).
tabled = { version = "0.17", features = ["std", "ansi"] }

# Live progress (ticking elapsed timer, spinner, bar, ETA) for the default UI.
indicatif = "0.17"

# SCG local-interface client (UDS + SHM via gRPC-provisioned endpoints).
scg-client = { path = "../SCG/crates/scg-client" }
scg-ipc = { path = "../SCG/crates/scg-ipc" }
scg-proto = { path = "../SCG/crates/scg-proto" }

# Async runtime — used ONLY for the gRPC management calls; data plane stays sync.
tokio = { version = "1", features = ["rt", "net", "time"] }
tonic = "0.12"
prost = "0.13"
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = 0
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
